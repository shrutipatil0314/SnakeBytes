<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Registration Form</h1>
        <p class="subtitle">Fill in your details and press Submit.</p>

        <form action="{{ url_for('register') }}" method="POST" novalidate>
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Rahul Sharma"
                   value="{{ form.get('name', '') }}">
            {% if errors.get('name') %}<span class="error">{{ errors['name'] }}</span>{% endif %}

            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="e.g. Pune"
                   value="{{ form.get('city', '') }}">
            {% if errors.get('city') %}<span class="error">{{ errors['city'] }}</span>{% endif %}

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="10 digit number"
                   value="{{ form.get('phone', '') }}">
            {% if errors.get('phone') %}<span class="error">{{ errors['phone'] }}</span>{% endif %}

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
